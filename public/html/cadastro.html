<section class="secao">
    <h2>Cadastro</h2>

    <div class="alerta alerta--aviso" role="status">
        <span aria-hidden="true">⚠️</span>
        <div>
            <strong>Preencha com atenção</strong>
            <span>Campos obrigatórios precisam estar corretos para o envio.</span>
        </div>
    </div>

    <form class="formulario" id="form-cadastro" action="#" method="post" novalidate>

        <fieldset class="campo-grupo">
            <legend>Dados pessoais</legend>
            <div class="campo">
                <label for="nome">Nome completo:</label>
                <input type="text" name="nome" id="nome"
                       autocomplete="name" required>
            </div>
            <div class="campo">
                <label for="cpf">CPF:</label>
                <input type="text" name="cpf" id="cpf"
                       inputmode="numeric"
                       pattern="\d{3}\.\d{3}\.\d{3}-\d{2}"
                       maxlength="14"
                       minlength="14"
                       autocomplete="off" required>
            </div>
            <div class="campo">
                <label for="dataNascimento">Data de nascimento:</label>
                <input type="date" name="dataNascimento" id="dataNascimento"
                       autocomplete="bday" required>
            </div>
        </fieldset>

        <fieldset class="campo-grupo">
            <legend>Contato</legend>
            <div class="campo">
                <label for="email">E-mail:</label>
                <input type="email" name="email" id="email"
                       autocomplete="email" required>
            </div>
            <div class="campo">
                <label for="telefone">Telefone:</label>
                <input type="tel" name="telefone" id="telefone"
                       inputmode="tel"
                       pattern="\(\d{2}\) \d{4,5}-\d{4}"
                       maxlength="15"
                       minlength="14"
                       autocomplete="tel" required>
            </div>
        </fieldset>

        <fieldset class="campo-grupo">
            <legend>Endereço</legend>

            <div class="campo">
                <label for="cep">CEP:</label>
                <input type="text" name="cep" id="cep"
                       inputmode="numeric"
                       pattern="\d{5}-\d{3}"
                       maxlength="9"
                       minlength="9"
                       autocomplete="postal-code" required>
            </div>

            <div class="campo">
                <label for="logradouro">Logradouro:</label>
                <input type="text" name="logradouro" id="logradouro"
                       autocomplete="address-line1" required>
            </div>

            <div class="campo">
                <label for="cidade">Cidade:</label>
                <input type="text" name="cidade" id="cidade"
                       autocomplete="address-level2" required>
            </div>

            <div class="campo">
                <label for="estado">Estado:</label>
                <select name="estado" id="estado"
                        autocomplete="address-level1" required>
                    <option value="">Selecione o estado</option>
                    <option value="AC">Acre</option>
                    <option value="AL">Alagoas</option>
                    <option value="AP">Amapá</option>
                    <option value="AM">Amazonas</option>
                    <option value="BA">Bahia</option>
                    <option value="CE">Ceará</option>
                    <option value="DF">Distrito Federal</option>
                    <option value="ES">Espírito Santo</option>
                    <option value="GO">Goiás</option>
                    <option value="MA">Maranhão</option>
                    <option value="MT">Mato Grosso</option>
                    <option value="MS">Mato Grosso do Sul</option>
                    <option value="MG">Minas Gerais</option>
                    <option value="PA">Pará</option>
                    <option value="PB">Paraíba</option>
                    <option value="PR">Paraná</option>
                    <option value="PE">Pernambuco</option>
                    <option value="PI">Piauí</option>
                    <option value="RJ">Rio de Janeiro</option>
                    <option value="RN">Rio Grande do Norte</option>
                    <option value="RS">Rio Grande do Sul</option>
                    <option value="RO">Rondônia</option>
                    <option value="RR">Roraima</option>
                    <option value="SC">Santa Catarina</option>
                    <option value="SP">São Paulo</option>
                    <option value="SE">Sergipe</option>
                    <option value="TO">Tocantins</option>
                </select>
            </div>
        </fieldset>

        <fieldset class="campo-grupo">
            <legend>Participação</legend>
            <p id="desc-participacao">Como você deseja participar?</p>

            <div role="group" aria-labelledby="desc-participacao">
                <div class="campo-checkbox">
                    <input type="checkbox" name="participacao" id="voluntariado"
                           value="voluntariado">
                    <label for="voluntariado">Voluntariado</label>
                </div>
                <div class="campo-checkbox">
                    <input type="checkbox" name="participacao" id="doacao"
                           value="doacao">
                    <label for="doacao">Doação</label>
                </div>
            </div>
        </fieldset>

        <button type="submit" class="botao botao--primario" id="btn-enviar">Enviar cadastro</button>
    </form>
</section>
