<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"
     width="160"
     height="160"
     role="img"
     aria-labelledby="icoAcessibilidade">
    <title id="icoAcessibilidade">Acessibilidade e inclusão</title>

    <!-- Anel de nós: a comunidade em teia (24 nós) -->
    <circle cx="60"
            cy="60"
            r="52"
            fill="none"
            stroke="#2E7D32"
            stroke-width="4.5"
            stroke-linecap="round"
            stroke-dasharray="0.01 13.6036"/>

    <!-- Figura de acesso universal -->
    <g stroke="#1565C0"
       stroke-width="7.5"
       stroke-linecap="round"
       fill="none">
        <path d="M60 47.5 V76"/>
        <path d="M35 58 H85"/>
        <path d="M60 76 L44 98"/>
        <path d="M60 76 L76 98"/>
    </g>
    <circle
            cx="60"
            cy="37"
            r="8.5"
            fill="#1565C0"/>
</svg>